name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy manually from the Actions tab.
  workflow_dispatch:

# Only what's needed to build and publish to Pages — nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an older queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
